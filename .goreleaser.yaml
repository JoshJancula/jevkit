version: 2

project_name: jevkit

before:
  hooks:
    - go mod tidy
    - go generate ./...

builds:
  - id: jevkit
    main: ./cmd/jevkit
    binary: jevkit
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - id: default
    ids: [jevkit]
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

sboms:
  - artifacts: archive

signs:
  - cmd: cosign
    artifacts: checksum
    signature: "${artifact}.sigstore.json"
    output: true
    args: ["sign-blob", "--bundle=${signature}", "${artifact}", "--yes"]

release:
  github:
    owner: JoshJancula
    name: jevkit
  prerelease: auto
  # Release Please may have created the release already. Use the reviewed
  # CHANGELOG.md entry even when its PR-body notes differ.
  mode: replace
  name_template: "{{ .ProjectName }} {{ .Version }}"
