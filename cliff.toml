# git-cliff configuration — https://git-cliff.org/docs/configuration
#
# Generates a Keep a Changelog (https://keepachangelog.com) style
# CHANGELOG.md from Conventional Commits (https://www.conventionalcommits.org).

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.1.0/),
and this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).
"""
body = """
{%- set repo_url = "https://github.com/JoshJancula/jevkit" -%}
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}]\
        ({{ repo_url }}/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}**BREAKING** {% endif %}\
            {{ commit.message | upper_first }} \
            ([{{ commit.id | truncate(length=7, end="") }}]\
            ({{ repo_url }}/commit/{{ commit.id }}))
    {% endfor %}
{% endfor %}\n
"""
footer = """
{%- set repo_url = "https://github.com/JoshJancula/jevkit" -%}
{%- for release in releases -%}
    {%- if release.version and release.previous.version -%}
        [{{ release.version | trim_start_matches(pat="v") }}]: \
            {{ repo_url }}/compare/{{ release.previous.version }}...{{ release.version }}
    {% endif -%}
{% endfor %}\
"""
trim = true
postprocessors = []
render_always = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v?[0-9]*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Changed" },
    { message = "^docs", group = "Documentation" },
    { message = "^security", group = "Security" },
    { message = "^style", group = "Changed", skip = true },
    { message = "^test", group = "Changed", skip = true },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Changed", skip = true },
    { message = "^ci", group = "Changed", skip = true },
    { message = "^build", group = "Changed", skip = true },
    { message = "^revert", group = "Fixed" },
    { body = ".*security", group = "Security" },
]

[bump]
features_always_bump_minor = true
breaking_always_bump_major = true
