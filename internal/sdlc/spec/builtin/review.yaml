version: 1
name: review
description: |
  WHEN: an existing diff needs an independent review, with no further
  implementation expected as part of this run.
  NOT FOR: implementing new work (use feature) or investigating and fixing a
  bug (use bugfix).

budgets:
  maxNodeAttempts: 3
  maxReroutes: 2

nodes:
  - id: receive-diff
    kind: work
    agent: self
    produces:
      - path: patch.diff
        required: true
        seedable: true
    objective: |
      Obtain the diff to review (already provided as context or seeded via
      --file) and write it to patch.diff verbatim.
    next: pick-reviewer

  - id: pick-reviewer
    kind: select
    questionSet: sdlc.agent-selection
    candidates: [local-security-reviewer, opencode-reviewer]
    state: { from: [task, patch.diff], maxBytes: 8000 }
    assignTo: review
    default: local-security-reviewer

  - id: review
    kind: work
    consumes: [{ path: patch.diff, required: true }]
    produces: [{ path: review.md, required: true }]
    objective: "Review patch.diff against the task description."
    next: disposition

  - id: disposition
    kind: decide
    questionSet: developer.review-disposition
    routes: { block: human-scope, needs-review: human-scope,
              informational: done, no-finding: done }
    default: human-scope

  - id: human-scope
    kind: human
    prompt: "The review found something. Continue, revise, or abort?"
    routes: { continue: done, revise: pick-reviewer, abort: aborted }

  - id: done
    kind: terminal
    outcome: succeeded
  - id: aborted
    kind: terminal
    outcome: aborted
