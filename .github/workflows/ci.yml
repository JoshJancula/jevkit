name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-config:
    name: Check release configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          install-only: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate GoReleaser config
        run: goreleaser check

      - name: Validate release notes extraction and version manifest
        run: |
          python3 -m unittest discover -s scripts -p 'test_release_notes.py'
          python3 -c 'import json; from pathlib import Path; config = json.loads(Path(".github/release-config.json").read_text()); manifest = json.loads(Path(".github/release-manifest.json").read_text()); assert set(config["packages"]) == set(manifest) == {"."}'
          version=$(python3 -c 'import json; print(json.load(open(".github/release-manifest.json"))["."])')
          python3 scripts/release-notes.py "v$version"

  lint-test:
    name: Devcontainer lint & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and test in devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          runCmd: make lint test

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test with race detector
        # Covers keystore (keychain abstraction), exec wrapper, and installer
        # packages among the full ./... suite.
        run: go test ./... -race

  installers:
    # Installs the latest published release with this change's installers,
    # verifying its signature where cosign is available, so an installer
    # bug fails a pull request instead of a release.
    name: Install latest release (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Find latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "JEVKIT_VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)" >> "$GITHUB_ENV"

      - name: Install cosign
        if: runner.os != 'Windows'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install with install.sh
        if: runner.os != 'Windows'
        env:
          JEVKIT_INSTALL_DIR: ${{ runner.temp }}/jevkit-bin
        run: |
          sh ./install.sh
          test "$("$JEVKIT_INSTALL_DIR/jevkit" version)" = "jevkit ${JEVKIT_VERSION#v}"

      - name: Install with install.ps1
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          JEVKIT_INSTALL_DIR: ${{ runner.temp }}\jevkit-bin
        run: |
          ./install.ps1
          $got = & (Join-Path $env:JEVKIT_INSTALL_DIR 'jevkit.exe') version
          if ($got -ne "jevkit $($env:JEVKIT_VERSION.TrimStart('v'))") { throw "installed version: $got" }
