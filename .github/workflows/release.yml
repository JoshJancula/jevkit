name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_call:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build or retry (for example v0.1.0)
        required: true
        type: string

permissions:
  contents: write
  id-token: write

jobs:
  release:
    if: github.repository == 'JoshJancula/jevkit'
    runs-on: ubuntu-latest
    concurrency:
      group: publish-${{ inputs.release_tag || github.ref_name }}
      cancel-in-progress: false
    env:
      JEVKIT_RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Validate release tag
        shell: bash
        run: |
          if [[ ! "$JEVKIT_RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a semantic version tag such as v0.1.0" >&2
            exit 1
          fi
          git fetch origin main
          git rev-parse --verify "refs/tags/$JEVKIT_RELEASE_TAG^{commit}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$JEVKIT_RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD origin/main

      - name: Read reviewed release notes
        run: python3 scripts/release-notes.py "$JEVKIT_RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Test
        run: go test ./...

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Publish GitHub Release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify release installer
        env:
          JEVKIT_VERSION: ${{ env.JEVKIT_RELEASE_TAG }}
          JEVKIT_INSTALL_DIR: ${{ runner.temp }}/jevkit-bin
        run: |
          sh ./install.sh
          "$JEVKIT_INSTALL_DIR/jevkit" version
